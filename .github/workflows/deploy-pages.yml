# ينشر الموقع على GitHub Pages عند كل دفع إلى main:
#   /          ← نظام متابعة الطلاب (index.html في جذر المستودع، كما هو)
#   /mizani/   ← تطبيق ميزاني بعد بنائه
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mizani/package-lock.json

      - name: Install dependencies
        working-directory: mizani
        run: npm ci

      - name: Run tests
        working-directory: mizani
        run: npm test

      - name: Build Mizani
        working-directory: mizani
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/mizani
          cp index.html _site/index.html
          cp -r mizani/dist/. _site/mizani/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}mizani/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
