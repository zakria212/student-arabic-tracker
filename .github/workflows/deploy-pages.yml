# يبني تطبيق ميزاني ويحفظ النسخة الجاهزة في مجلد app/ على الفرع main.
# GitHub Pages (وضع النشر من الفرع) ينشر الملفات كما هي، فيصبح:
#   /      ← نظام متابعة الطلاب (index.html)
#   /app/  ← تطبيق ميزاني
name: Build Mizani app

on:
  push:
    branches: [main]
    paths:
      - 'mizani/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mizani/package-lock.json

      - name: Install dependencies
        working-directory: mizani
        run: npm ci

      - name: Run tests
        working-directory: mizani
        run: npm test

      - name: Build
        working-directory: mizani
        run: npm run build

      - name: Update app/ folder
        run: |
          rm -rf app
          cp -r mizani/dist app
          rm -f app/assets/*.woff
          git add -A app
          if git diff --cached --quiet; then
            echo "app/ is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update built Mizani app"
          git push
